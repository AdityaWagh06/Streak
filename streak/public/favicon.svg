<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39d353" />
      <stop offset="100%" stop-color="#006d32" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="#0d1117" />
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="#30363d" stroke-width="8" fill="none" />
  
  <!-- Git Commit Branch Flow -->
  <path d="M140 380V132" stroke="#30363d" stroke-width="28" stroke-linecap="round" />
  <path d="M140 256C220 256 260 160 372 160" stroke="#238636" stroke-width="24" stroke-linecap="round" fill="none" />
  <path d="M372 160V380" stroke="#30363d" stroke-width="28" stroke-linecap="round" />

  <!-- Nodes -->
  <circle cx="140" cy="380" r="36" fill="#161b22" stroke="#30363d" stroke-width="20" />
  <circle cx="140" cy="132" r="36" fill="#161b22" stroke="#30363d" stroke-width="20" />
  <circle cx="372" cy="380" r="36" fill="#161b22" stroke="#30363d" stroke-width="20" />
  
  <!-- Glowing Active Flame/Commit Node -->
  <g filter="url(#glow)">
    <circle cx="372" cy="160" r="54" fill="url(#grad)" />
    <!-- Flame / Check Icon inside -->
    <path d="M356 160L368 172L392 146" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
